<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Simulador de RISC-V en el navegador" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>rvscope</title>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">rvscope</span>
      <span class="label" id="core-status" role="status">cargando núcleo…</span>
    </header>
    <main id="app">
      <section class="panel" aria-labelledby="summary-title">
        <h2 class="label" id="summary-title">Ejecución · factorial.s</h2>
        <div id="summary" class="summary"></div>
      </section>
      <section class="panel" aria-labelledby="registers-title">
        <h2 class="label" id="registers-title">Registros</h2>
        <div id="registers" class="registers"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
